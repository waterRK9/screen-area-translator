<!DOCTYPE html>
<html>
<head>
  <title>Screen Area Translator Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 420px; color: #333; }
    label { font-weight: bold; display: block; margin-top: 12px; font-size: 13px; }
    input, select { width: 100%; padding: 8px; margin: 4px 0 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    button { padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button:hover { background: #0056b3; }
    .status { margin-top: 10px; color: green; font-weight: bold; text-align: center; }
    .hint { font-size: 11px; color: #666; margin-top: -6px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>Screen Area Translator Settings</h2>

  <label for="provider">AI Provider:</label>
  <select id="provider">
    <option value="gemini">Google Gemini API</option>
    <option value="openai">OpenAI</option>
    <option value="claude">Anthropic Claude</option>
    <option value="ollama">Ollama (Local)</option>
    <option value="custom">Custom / OpenAI-Compatible (vLLM, LM Studio, OpenRouter)</option>
  </select>

  <!-- Gemini Fields -->
  <div id="gemini-fields">
    <label for="apiKey">Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="Paste Gemini API key here">
    <label for="geminiModel">Model Override (Optional):</label>
    <input type="text" id="geminiModel" placeholder="Leave blank for Default / Auto-Select">
    <div class="hint">When blank, automatically finds active vision models.</div>
  </div>

  <!-- OpenAI Fields -->
  <div id="openai-fields" style="display: none;">
    <label for="openaiKey">OpenAI API Key:</label>
    <input type="password" id="openaiKey" placeholder="sk-...">
    <label for="openaiModel">Model Override (Optional):</label>
    <input type="text" id="openaiModel" placeholder="Leave blank for Default model">
  </div>

  <!-- Claude Fields -->
  <div id="claude-fields" style="display: none;">
    <label for="claudeKey">Anthropic API Key:</label>
    <input type="password" id="claudeKey" placeholder="sk-ant-...">
    <label for="claudeModel">Model Override (Optional):</label>
    <input type="text" id="claudeModel" placeholder="Leave blank for Default model">
  </div>

  <!-- Generic / Local Custom Fields -->
  <div id="custom-fields" style="display: none;">
    <label for="baseUrl">Endpoint / Base URL:</label>
    <input type="text" id="baseUrl" placeholder="e.g. http://localhost:11434 or http://localhost:8000/v1">
    <div class="hint" id="url-hint">Base endpoint URL</div>

    <label for="modelName">Vision Model Name (Optional):</label>
    <input type="text" id="modelName" placeholder="Leave blank for Default model">

    <div id="custom-api-key-field">
      <label for="customApiKey">API Key (Optional):</label>
      <input type="password" id="customApiKey" placeholder="Bearer Token or Key (Leave blank for local)">
    </div>
  </div>

  <label for="targetLanguage">Default Target Language / Style:</label>
  <input type="text" id="targetLanguage" placeholder="e.g. English, Spanish, Pirate Talk">

  <button id="save">Save Settings</button>
  <div id="status" class="status"></div>
  <script src="options.js"></script>
</body>
</html>
